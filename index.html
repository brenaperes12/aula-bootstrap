<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
   integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>

<body>

  <ul class="nav justify-content-center">
    <li class="nav-item">
      <a class="nav-link active" aria-current="page" href="#" >Info</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" target="_blank" href="https://www.netflix.com/br/title/80100172" button type="button" class="btn btn-outline-secondary"></button>Assista na Netflix</a>
      
    </li>
  </ul>

  <div id="carouselExampleCaptions" class="carousel slide">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
        aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
        aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
        aria-label="Slide 3"></button>
    </div>

    

    <div class="carousel-inner">

      <div class="ratio ratio-16x9">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/ESEUoa-mz2c?si=Q0CrlHhJ93H4lgs8"
        title="YouTube video player" frameborder="50px"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
      
      <div class="carousel-item active">
        <img src="https://i.pinimg.com/1200x/ae/92/85/ae928559e3bd995fb105cee792286ebc.jpg" class="d-block w-100"
          alt="...">
        
        <div class="carousel-caption d-none d-md-block">
          <h5>Sic Mundus Creatus Est</h5>

        </div>
      </div>
      <div class="carousel-item">
        <div class="z-3 position-absolute p-5 rounded-3"><span>z-3</span></div>
        <div class="z-2 position-absolute p-5 rounded-3"><span>z-2</span></div>
        <div class="z-1 position-absolute p-5 rounded-3"><span>z-1</span></div>
        <div class="z-0 position-absolute p-5 rounded-3"><span>z-0</span></div>
        <div class="z-n1 position-absolute p-5 rounded-3"><span>z-n1</span></div>
        <img src="https://i.pinimg.com/1200x/b7/80/6e/b7806e616bf0cccd79a3586d3c748ed3.jpg" class="d-block w-100"
          alt="...">
        <div class="carousel-caption d-none d-md-block">
          <h5>Wo ist mikkel?</h5>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://i.pinimg.com/1200x/8e/d2/70/8ed270507176d28566e7fee97eb6ed51.jpg" class="d-block w-100"
          alt="...">
        <div class="carousel-caption d-none d-md-block">
          <h5>Der Anfang ist das Ende und das Ende ist der Anfang</h5>
          <p>"Die Frage ist nicht aus welcher Zeit, sondern aus welcher Welt"</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
</body>

</html>
